name: Check Freelancehunt

on:
  schedule:
    # Зсув хвилин (3,8,13,...): GitHub частіше пропускає запуски на :00/:05
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [check]

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freelancehunt
        id: fh
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check.mjs
      - name: Freelance.ua
        id: fu
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/freelanceua.mjs
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/*.json
          git diff --staged --quiet || (git commit -m "chore: update seen projects" && git push)
      - name: Fail if any source failed
        if: steps.fh.outcome == 'failure' || steps.fu.outcome == 'failure'
        run: exit 1
